<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超現實立體畫框 - 3D 互動展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Three.js 與 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1612;
            user-select: none;
        }
        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .glass-panel {
            background: rgba(28, 24, 20, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .gold-btn {
            background: linear-gradient(135deg, rgba(60, 48, 34, 0.9), rgba(38, 30, 22, 0.9));
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #f3e5ab;
            transition: all 0.25s ease;
        }
        .gold-btn:hover, .gold-btn.active {
            background: linear-gradient(135deg, #c59b27, #8a6611);
            color: #fff;
            border-color: #ffe885;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(197, 155, 39, 0.35);
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e5c158;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .toast-msg {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
    </style>
</head>
<body class="relative">

    <!-- 3D 畫布容器 -->
    <div id="canvas-container"></div>

    <!-- 頂部標題與互動提示列 -->
    <div class="fixed top-4 left-4 right-4 md:left-6 md:right-auto z-10 pointer-events-none flex flex-col gap-2 max-w-md">
        <div class="glass-panel rounded-2xl px-5 py-3.5 pointer-events-auto">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <span class="text-xs uppercase tracking-widest text-amber-400/90 font-semibold block">3D Interactive Diorama</span>
                    <h1 class="serif-title text-xl md:text-2xl font-bold text-amber-50">《破框而出的春日澆灌》</h1>
                </div>
                <button id="toggle-ui-btn" class="md:hidden gold-btn px-3 py-1.5 rounded-lg text-xs font-medium">
                    收合選單
                </button>
            </div>
            <p class="text-xs text-stone-300 mt-1.5 leading-relaxed">
                拖曳滑鼠旋轉 360° 視角、滾輪縮放。試著<span class="text-amber-300 font-medium">點擊畫中女孩、澆水壺、地板水窪、立燈或青蘋果</span>觸發驚喜互動！
            </p>
        </div>

        <!-- 動態互動回饋提示 -->
        <div id="toast" class="toast-msg opacity-0 -translate-y-2 glass-panel rounded-xl px-4 py-2.5 text-amber-200 text-xs font-medium flex items-center gap-2 self-start">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            <span id="toast-text">已觸發互動！</span>
        </div>
    </div>

    <!-- 右側控制面板 -->
    <div id="control-panel" class="fixed bottom-4 right-4 left-4 md:left-auto md:top-4 md:bottom-auto md:w-80 z-10 glass-panel rounded-2xl p-4 text-stone-100 flex flex-col gap-4 max-h-[82vh] overflow-y-auto">
        
        <!-- 鏡頭快速視角 -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold tracking-wider text-amber-300 uppercase">快速鏡頭視角</span>
                <span class="text-[11px] text-stone-400">點擊平滑切換</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button data-cam="overview" class="cam-btn gold-btn active py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                    <span>🖼️</span> 正面全景
                </button>
                <button data-cam="portal" class="cam-btn gold-btn py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                    <span>🌻</span> 畫框破界特寫
                </button>
                <button data-cam="puddle" class="cam-btn gold-btn py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                    <span>💧</span> 地板水窪視角
                </button>
                <button data-cam="sofa" class="cam-btn gold-btn py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                    <span>🛋️</span> 沙發側視角
                </button>
            </div>
        </div>

        <hr class="border-amber-500/20">

        <!-- 動態參數控制 -->
        <div class="space-y-3">
            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-stone-200 font-medium">🚿 澆水水量控制</span>
                    <span id="water-val-label" class="text-amber-300 font-mono">100%</span>
                </div>
                <input id="water-slider" type="range" min="0" max="200" value="100">
            </div>

            <div>
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-stone-200 font-medium">✨ 畫框立體破界深度</span>
                    <span id="depth-val-label" class="text-amber-300 font-mono">100%</span>
                </div>
                <input id="depth-slider" type="range" min="20" max="170" value="100">
            </div>
        </div>

        <hr class="border-amber-500/20">

        <!-- 室內燈光氛圍 -->
        <div>
            <span class="text-xs font-semibold tracking-wider text-amber-300 uppercase block mb-2">室內光影氛圍</span>
            <div class="grid grid-cols-3 gap-1.5">
                <button data-light="afternoon" class="light-btn gold-btn active py-1.5 px-2 rounded-lg text-xs font-medium">
                    ☀️ 溫暖午後
                </button>
                <button data-light="golden" class="light-btn gold-btn py-1.5 px-2 rounded-lg text-xs font-medium">
                    🌇 黃昏微光
                </button>
                <button data-light="night" class="light-btn gold-btn py-1.5 px-2 rounded-lg text-xs font-medium">
                    🌙 夜間立燈
                </button>
            </div>
        </div>

        <!-- 互動快捷與自動環繞 -->
        <div class="flex items-center justify-between pt-1 gap-2">
            <button id="splash-btn" class="flex-1 gold-btn py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                <span>🌊</span> 傾倒大水花
            </button>
            <button id="autorotate-btn" class="flex-1 gold-btn py-2 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5">
                <span>🔄</span> 自動環繞：關
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 產生程序化質感貼圖 (油畫筆觸、木地板、波斯地毯、復古金框)
        // ==========================================
        function createWoodFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#8b5e34';
            ctx.fillRect(0, 0, 512, 512);

            const planks = 8;
            const plankH = 512 / planks;
            for (let i = 0; i < planks; i++) {
                const y = i * plankH;
                const hueShift = (Math.random() - 0.5) * 14;
                ctx.fillStyle = `hsl(${28 + hueShift}, 46%, ${36 + (i % 2) * 3}%)`;
                ctx.fillRect(0, y, 512, plankH - 2);

                // 木紋線條
                ctx.strokeStyle = 'rgba(60, 35, 15, 0.18)';
                ctx.lineWidth = 1.5;
                for (let g = 0; g < 14; g++) {
                    ctx.beginPath();
                    const gy = y + Math.random() * plankH;
                    ctx.moveTo(0, gy);
                    ctx.bezierCurveTo(170, gy + (Math.random() - 0.5) * 10, 340, gy + (Math.random() - 0.5) * 10, 512, gy);
                    ctx.stroke();
                }

                // 拼接縫隙
                ctx.fillStyle = '#4a2c11';
                ctx.fillRect(0, y + plankH - 2, 512, 2);
                const jointX = ((i * 173) % 400) + 50;
                ctx.fillRect(jointX, y, 2, plankH);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 3);
            return tex;
        }

        function createRugTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');

            // 米灰復古底色
            ctx.fillStyle = '#b9ab96';
            ctx.fillRect(0, 0, 512, 384);

            // 編織紋理噪點
            for (let i = 0; i < 6000; i++) {
                ctx.fillStyle = i % 2 === 0 ? 'rgba(90,75,60,0.08)' : 'rgba(240,230,215,0.08)';
                ctx.fillRect(Math.random() * 512, Math.random() * 384, 3, 2);
            }

            // 外框古典幾何花邊
            ctx.strokeStyle = '#6e5a46';
            ctx.lineWidth = 12;
            ctx.strokeRect(20, 20, 472, 344);

            ctx.strokeStyle = '#8c4a32';
            ctx.lineWidth = 4;
            ctx.strokeRect(36, 36, 440, 312);

            // 中央古典圖騰
            ctx.fillStyle = 'rgba(110, 90, 70, 0.25)';
            ctx.beginPath();
            ctx.ellipse(256, 192, 150, 95, 0, 0, Math.PI * 2);
            ctx.fill();

            for (let x = 60; x <= 452; x += 28) {
                ctx.fillStyle = '#5c4b3b';
                ctx.fillRect(x, 22, 8, 8);
                ctx.fillRect(x, 354, 8, 8);
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createOilPaintingBackdropTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            // 溫暖陽光石牆與藍天漸層底色
            const grad = ctx.createLinearGradient(0, 0, 512, 640);
            grad.addColorStop(0, '#89a7b8');
            grad.addColorStop(0.35, '#d8c9a7');
            grad.addColorStop(0.75, '#c7b083');
            grad.addColorStop(1, '#9d845b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 640);

            // 印象派油畫筆觸效果 (陽光斑駁石板地與花牆)
            const palette = [
                '#e6d7b2', '#d2be92', '#8ba8b5', '#a9c1ca',
                '#496b2e', '#658b38', '#335220', '#c9a66b', '#b8945a'
            ];
            for (let i = 0; i < 4500; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 640;
                // 左側偏綠叢，右下方偏石板路陽光斑駁
                let color;
                if (x < 210) {
                    const greens = ['#2f4f1d', '#496e2c', '#6a8f3d', '#84a852', '#3a5a24'];
                    color = greens[Math.floor(Math.random() * greens.length)];
                } else if (y > 380) {
                    const stones = ['#d8c396', '#b89e6e', '#947e57', '#e5d4ae', '#7d6b4d'];
                    color = stones[Math.floor(Math.random() * stones.length)];
                } else {
                    color = palette[Math.floor(Math.random() * palette.length)];
                }
                ctx.fillStyle = color;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.8);
                ctx.fillRect(-7, -3, 14 + Math.random() * 8, 6 + Math.random() * 4);
                ctx.restore();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 2. 初始化場景、相機與渲染器
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1f1b17);
        scene.fog = new THREE.FogExp2(0x1f1b17, 0.022);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(-1.3, 2.35, 6.6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0.15, 2.05, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // 避免穿入地板下
        controls.minDistance = 2.0;
        controls.maxDistance = 13.0;

        // 儲存可點擊互動的物件清單
        const interactables = [];
        function registerInteractable(mesh, name, handler) {
            mesh.userData.interactName = name;
            mesh.userData.onClick = handler;
            interactables.push(mesh);
        }

        // ==========================================
        // 3. 燈光系統（支援三種氛圍切換 + 立燈開關）
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.58);
        scene.add(ambientLight);

        // 主陽光（從左前方斜射入客廳）
        const sunLight = new THREE.DirectionalLight(0xfff1d6, 1.15);
        sunLight.position.set(-5.5, 6.8, 5.5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 20;
        const d = 6;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 畫框內部的地中海陽光點光源（讓畫框內部永遠明亮立體）
        const portalLight = new THREE.PointLight(0xfffaed, 1.1, 5.5);
        portalLight.position.set(0.7, 3.1, -0.1);
        scene.add(portalLight);

        // 立燈的暖黃光源
        const floorLampLight = new THREE.PointLight(0xffb74d, 0.95, 6.5);
        floorLampLight.position.set(-2.65, 2.55, -0.75);
        floorLampLight.castShadow = true;
        scene.add(floorLampLight);

        let lampIsOn = true;

        // ==========================================
        // 4. 建立客廳建築結構（牆面、踢腳線、木地板、地毯）
        // ==========================================
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // 溫潤米白主牆面 (預留中央畫框凹槽，由四塊拼成，讓畫框內部真正凹入牆體)
        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xd8cbb8,
            roughness: 0.88,
            metalness: 0.02
        });

        // 畫框中心位於 (0.65, 2.75, 0)，寬 3.0，高 3.55
        const portalCenterX = 0.65;
        const portalCenterY = 2.75;
        const portalW = 3.0;
        const portalH = 3.55;

        // 左側牆體
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(5.35, 6.2, 0.25), wallMat);
        leftWall.position.set(-3.525, 3.1, -0.125);
        leftWall.receiveShadow = true;
        roomGroup.add(leftWall);

        // 右側牆體
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(4.0, 6.2, 0.25), wallMat);
        rightWall.position.set(4.15, 3.1, -0.125);
        rightWall.receiveShadow = true;
        roomGroup.add(rightWall);

        // 上方牆體
        const topWall = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.675, 0.25), wallMat);
        topWall.position.set(portalCenterX, 5.3625, -0.125);
        topWall.receiveShadow = true;
        roomGroup.add(topWall);

        // 下方牆體
        const bottomWall = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.975, 0.25), wallMat);
        bottomWall.position.set(portalCenterX, 0.4875, -0.125);
        bottomWall.receiveShadow = true;
        roomGroup.add(bottomWall);

        // 左側轉角延伸牆（營造書櫃後的空間感）
        const sideWallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.25, 6.2, 7.5), wallMat);
        sideWallLeft.position.set(-6.1, 3.1, 2.5);
        sideWallLeft.receiveShadow = true;
        roomGroup.add(sideWallLeft);

        // 白色古典踢腳板 (Baseboard)
        const baseboardMat = new THREE.MeshStandardMaterial({ color: 0xeae2d6, roughness: 0.6 });
        const baseboardMain = new THREE.Mesh(new THREE.BoxGeometry(12.4, 0.22, 0.06), baseboardMat);
        baseboardMain.position.set(0, 0.11, 0.03);
        baseboardMain.receiveShadow = true;
        roomGroup.add(baseboardMain);

        const baseboardTopTrim = new THREE.Mesh(new THREE.BoxGeometry(12.4, 0.03, 0.08), baseboardMat);
        baseboardTopTrim.position.set(0, 0.225, 0.035);
        roomGroup.add(baseboardTopTrim);

        // 溫潤木地板
        const floorTex = createWoodFloorTexture();
        const floorMat = new THREE.MeshStandardMaterial({
            map: floorTex,
            roughness: 0.42,
            metalness: 0.05
        });
        const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.set(0, 0, 3.5);
        floorMesh.receiveShadow = true;
        roomGroup.add(floorMesh);

        // 復古波斯地毯
        const rugTex = createRugTexture();
        const rugMat = new THREE.MeshStandardMaterial({
            map: rugTex,
            roughness: 0.92
        });
        const rugMesh = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.025, 2.9), rugMat);
        rugMesh.position.set(-0.55, 0.013, 2.65);
        rugMesh.rotation.y = 0.04;
        rugMesh.receiveShadow = true;
        roomGroup.add(rugMesh);

        // ==========================================
        // 5. 核心視覺焦點：古典雕花金框 & 3D 破界立體畫中世界
        // ==========================================
        const portalGroup = new THREE.Group();
        portalGroup.position.set(portalCenterX, portalCenterY, 0);
        scene.add(portalGroup);

        // 5.1 華麗復古金色畫框
        const goldMat = new THREE.MeshStandardMaterial({
            color: 0xc59838,
            roughness: 0.28,
            metalness: 0.82
        });
        const darkGoldMat = new THREE.MeshStandardMaterial({
            color: 0x8f681c,
            roughness: 0.4,
            metalness: 0.75
        });

        const frameGroup = new THREE.Group();
        portalGroup.add(frameGroup);

        const fw = 0.30; // 邊框寬度
        const fd = 0.22; // 邊框厚度

        // 上下左右外框主體
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(portalW + fw * 2, fw, fd), goldMat);
        topBar.position.set(0, portalH / 2 + fw / 2, fd / 2);
        topBar.castShadow = true;
        topBar.receiveShadow = true;
        frameGroup.add(topBar);

        const bottomBar = new THREE.Mesh(new THREE.BoxGeometry(portalW + fw * 2, fw, fd), goldMat);
        bottomBar.position.set(0, -portalH / 2 - fw / 2, fd / 2);
        bottomBar.castShadow = true;
        bottomBar.receiveShadow = true;
        frameGroup.add(bottomBar);

        const leftBar = new THREE.Mesh(new THREE.BoxGeometry(fw, portalH, fd), goldMat);
        leftBar.position.set(-portalW / 2 - fw / 2, 0, fd / 2);
        leftBar.castShadow = true;
        leftBar.receiveShadow = true;
        frameGroup.add(leftBar);

        const rightBar = new THREE.Mesh(new THREE.BoxGeometry(fw, portalH, fd), goldMat);
        rightBar.position.set(portalW / 2 + fw / 2, 0, fd / 2);
        rightBar.castShadow = true;
        rightBar.receiveShadow = true;
        frameGroup.add(rightBar);

        // 內層金色立體線板與雕花浮雕裝飾
        const innerTrimW = 0.06;
        const innerTop = new THREE.Mesh(new THREE.BoxGeometry(portalW + 0.04, innerTrimW, fd + 0.05), darkGoldMat);
        innerTop.position.set(0, portalH / 2 + 0.02, fd / 2 + 0.02);
        frameGroup.add(innerTop);

        const innerBot = new THREE.Mesh(new THREE.BoxGeometry(portalW + 0.04, innerTrimW, fd + 0.05), darkGoldMat);
        innerBot.position.set(0, -portalH / 2 - 0.02, fd / 2 + 0.02);
        frameGroup.add(innerBot);

        const innerLeft = new THREE.Mesh(new THREE.BoxGeometry(innerTrimW, portalH + 0.04, fd + 0.05), darkGoldMat);
        innerLeft.position.set(-portalW / 2 - 0.02, 0, fd / 2 + 0.02);
        frameGroup.add(innerLeft);

        const innerRight = new THREE.Mesh(new THREE.BoxGeometry(innerTrimW, portalH + 0.04, fd + 0.05), darkGoldMat);
        innerRight.position.set(portalW / 2 + 0.02, 0, fd / 2 + 0.02);
        frameGroup.add(innerRight);

        // 四角與邊框中央巴洛克立體雕花飾塊
        const cornerPositions = [
            [-portalW / 2 - fw / 2, portalH / 2 + fw / 2],
            [portalW / 2 + fw / 2, portalH / 2 + fw / 2],

        const DROP_COUNT = 520;
        const dropGeo = new THREE.BufferGeometry();
        const dropPositions = new Float32Array(DROP_COUNT * 3);
        const dropVelocities = [];
        const dropTypes = []; // 0: 壺嘴到花盆, 1: 畫框下緣流淌至地板, 2: 地板激起的水花

        // 計算世界座標下壺嘴的位置
        const nozzleOrigin = new THREE.Vector3(0.45, 2.52, 0.56);

        function resetParticle(i, typeOverride = null) {
            const type = typeOverride !== null ? typeOverride : (i < 160 ? 0 : (i < 390 ? 1 : 2));
            dropTypes[i] = type;

            if (type === 0) {
                // 從澆水壺蓮蓬頭灑向花叢
                dropPositions[i * 3] = nozzleOrigin.x + (Math.random() - 0.5) * 0.09;
                dropPositions[i * 3 + 1] = nozzleOrigin.y + (Math.random() - 0.5) * 0.08;
                dropPositions[i * 3 + 2] = nozzleOrigin.z + (Math.random() - 0.5) * 0.09;
                dropVelocities[i] = {
                    vx: (Math.random() - 0.45) * 0.45,
                    vy: -1.2 - Math.random() * 1.1,
                    vz: (Math.random() - 0.35) * 0.45
                };
            } else if (type === 1) {
                // 從花盆與金色下畫框邊緣匯聚成兩道主水流，直接往客廳木地板傾瀉而下
                const streamIndex = i % 2;
                const baseX = streamIndex === 0 ? 0.38 : 0.52;
                dropPositions[i * 3] = baseX + (Math.random() - 0.5) * 0.14;
                dropPositions[i * 3 + 1] = 1.95 - Math.random() * 0.65;
                dropPositions[i * 3 + 2] = 0.42 + Math.random() * 0.18;
                dropVelocities[i] = {
                    vx: (Math.random() - 0.5) * 0.16,
                    vy: -1.8 - Math.random() * 1.8,
                    vz: 0.06 + Math.random() * 0.14
                };
            } else {
                // 撞擊客廳木地板後向四周彈跳的白色晶瑩水珠
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 0.24;
                dropPositions[i * 3] = puddleCenter.x + Math.cos(angle) * radius;
                dropPositions[i * 3 + 1] = 0.02 + Math.random() * 0.05;
                dropPositions[i * 3 + 2] = puddleCenter.z + Math.sin(angle) * radius;
                const speed = (0.35 + Math.random() * 0.85) * (1 + splashBoost * 0.6);
                dropVelocities[i] = {
                    vx: Math.cos(angle) * speed,
                    vy: 0.85 + Math.random() * 1.45 * (1 + splashBoost * 0.5),
                    vz: Math.sin(angle) * speed
                };
            }
        }

            resetParticle(i);
            // 隨機打散初始高度避免同時落下

        }

        document.getElementById('splash-btn').addEventListener('click', () => triggerBigSplash());

        const autoRotateBtn = document.getElementById('autorotate-btn');
        autoRotateBtn.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 1.4;
            autoRotateBtn.classList.toggle('active', controls.autoRotate);
            autoRotateBtn.innerHTML = controls.autoRotate ? '<span>🔄</span> 自動環繞：開' : '<span>🔄</span> 自動環繞：關';
        });

        // 手機版收合控制面板
        const toggleUiBtn = document.getElementById('toggle-ui-btn');
        const controlPanel = document.getElementById('control-panel');
        toggleUiBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('hidden');
            toggleUiBtn.textContent = controlPanel.classList.contains('hidden') ? '展開控制' : '收合選單';
        });

        // Raycaster 3D 物件點擊偵測
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            downPos.x = e.clientX;
            downPos.y = e.clientY;
        });

        window.addEventListener('pointerup', (e) => {
            // 排除拖曳旋轉鏡頭的操作
            if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
            if (e.target !== renderer.domElement) return;

            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactables, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj && !obj.userData.onClick) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.onClick) {
                    obj.userData.onClick();
                }
            }
        });

        // ==========================================
        // 10. 主動畫迴圈 (水流物理、漣漪擴散、女孩與花朵微動)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // 1. 相機平滑飛行過渡
            if (targetCamPos && targetLookAt) {
                camera.position.lerp(targetCamPos, 0.07);
                controls.target.lerp(targetLookAt, 0.07);
                if (camera.position.distanceTo(targetCamPos) < 0.03) {
                    targetCamPos = null;
                    targetLookAt = null;
                }
            }
            controls.update();

            // 2. 傾倒水花加成衰減與澆水壺動態傾角
            if (splashBoost > 0) {
                splashBoost = Math.max(0, splashBoost - dt * 1.1);
            }
            const tiltWave = Math.sin(elapsed * 2.2) * 0.035 - splashBoost * 0.14;
            wateringCanGroup.rotation.z = -0.68 + tiltWave;
            headGroup.rotation.z = Math.sin(elapsed * 1.5) * 0.03;

            // 3. 雛菊受水流衝擊的輕微搖曳
            daisyFlowers.forEach((f) => {
                f.rotation.x = f.userData.baseRotX + Math.sin(elapsed * 5 + f.userData.phase) * 0.05 * waterIntensity;
            });

            // 4. 青蘋果點擊跳動回彈
            apples.forEach((apple) => {
                if (apple.userData.jumpVel) {
                    apple.position.y += apple.userData.jumpVel;
                    apple.userData.jumpVel -= 0.008;
                    if (apple.position.y <= apple.userData.baseY) {
                        apple.position.y = apple.userData.baseY;
                        apple.userData.jumpVel = 0;
                    }
                }
            });

            // 5. 更新水珠粒子下落與地板濺射
            const effectiveFlow = waterIntensity + splashBoost * 0.65;
            waterParticles.visible = effectiveFlow > 0.02;

            if (waterParticles.visible) {
                const posArr = dropGeo.attributes.position.array;
                for (let i = 0; i < DROP_COUNT; i++) {
                    const v = dropVelocities[i];
                    const t = dropTypes[i];

                    posArr[i * 3] += v.vx * dt * effectiveFlow;
                    posArr[i * 3 + 1] += v.vy * dt * (t === 2 ? 1 : effectiveFlow);
                    posArr[i * 3 + 2] += v.vz * dt * effectiveFlow;

                    if (t === 2) {
                        // 地板濺起的水珠受重力回落
                        v.vy -= 4.8 * dt;
                        if (posArr[i * 3 + 1] <= 0.01) {
                            resetParticle(i, 2);
                        }
                    } else if (t === 0) {
                        // 壺嘴灑落花叢
                        v.vy -= 2.2 * dt;
                        if (posArr[i * 3 + 1] < 1.55) {
                            resetParticle(i, 0);
                        }
                    } else {
                        // 從畫框下緣直落木地板的水柱
                        v.vy -= 3.2 * dt;
                        if (posArr[i * 3 + 1] <= 0.02) {
                            resetParticle(i, 1);
                        }
                    }
                }
                dropGeo.attributes.position.needsUpdate = true;
            }

            // 6. 地板水窪漣漪擴散動畫
            rippleRings.forEach((ring) => {
                ring.userData.progress += dt * (0.55 + effectiveFlow * 0.35);
                if (ring.userData.progress > 1) {
                    ring.userData.progress -= 1;
                }
                const p = ring.userData.progress;
                const scale = 0.3 + p * 6.5;
                ring.scale.set(scale * 1.25, scale * 0.85, 1);
                ring.material.opacity = (1 - p) * 0.55 * Math.min(1.2, effectiveFlow);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
